name: Build lk2nd MSM8953

on:
  push:
    branches: [lk2nd]
  workflow_dispatch:

permissions:
  contents: read

env:
  LK2ND_URL: https://github.com/msm8916-mainline/lk2nd.git
  LK2ND_REF: "23.1"

jobs:
  lk2nd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout lk2nd branch
        uses: actions/checkout@v4

      - name: Install lk2nd build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates make gcc-arm-none-eabi file

      - name: Build lk2nd for MSM8953/SDM632
        run: |
          set -euxo pipefail
          rm -rf lk2nd out
          mkdir -p out

          git clone --depth=1 --branch "$LK2ND_REF" "$LK2ND_URL" lk2nd
          make -C lk2nd -j"$(nproc)" TOOLCHAIN_PREFIX=arm-none-eabi- lk2nd-msm8953

          LK2ND_IMG="lk2nd/build-lk2nd-msm8953/lk2nd.img"
          test -s "$LK2ND_IMG"
          strings "$LK2ND_IMG" | grep -F "Motorola Moto G7 Play (Channel)"
          strings "$LK2ND_IMG" | grep -F "sdm632-motorola-channel"

          cp "$LK2ND_IMG" out/lk2nd-msm8953.img
          git -C lk2nd rev-parse HEAD > out/lk2nd-commit.txt
          sha256sum out/lk2nd-msm8953.img | tee out/SHA256SUMS.lk2nd

      - name: Upload lk2nd artifact
        uses: actions/upload-artifact@v4
        with:
          name: channel-lk2nd-msm8953
          path: |
            out/lk2nd-msm8953.img
            out/lk2nd-commit.txt
            out/SHA256SUMS.lk2nd
          if-no-files-found: error
          retention-days: 14
