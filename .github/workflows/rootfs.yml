name: Build Ubuntu minimal rootfs

on:
  workflow_dispatch:
    inputs:
      reuse_kernel:
        description: Reuse compiled kernel artifact (on keeps the existing behavior)
        type: boolean
        required: true
        default: true
      kernel_run_id:
        description: Optional run ID if reuse is on; empty uses latest live artifact
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  KERNEL_URL: https://github.com/SaaSD3v/linux.git
  KERNEL_REF: msm8953/latest

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout rootfs build files
        uses: actions/checkout@v4
        with:
          ref: ubuntu

      - name: Validate existing rootfs scripts
        run: |
          set -eux
          bash -n scripts/build-kernel.sh
          bash -n scripts/build-rootfs.sh
          sh -n rootfs/usr/local/sbin/channel-usb-gadget

      - name: Install rootfs and kernel dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl make bc bison flex \
            gcc-aarch64-linux-gnu device-tree-compiler \
            libssl-dev libelf-dev dwarves \
            rsync cpio gzip xz-utils zstd \
            e2fsprogs arch-test qemu-user-static binfmt-support \
            openssh-client openssl kmod file

          sudo update-binfmts --enable qemu-aarch64
          arch-test arm64

      - name: Find reusable kernel artifact
        id: kernel_run
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.kernel_run_id }}
          REUSE_KERNEL: ${{ github.event_name != 'workflow_dispatch' || inputs.reuse_kernel }}
        run: |
          set -euxo pipefail
          if [ "$REUSE_KERNEL" = "false" ]; then
            if [ -n "$REQUESTED_RUN_ID" ]; then
              echo "::error::kernel_run_id only applies when kernel reuse is enabled." >&2
              exit 1
            fi
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "Kernel reuse disabled; building current kernel source."
            exit 0
          fi

          artifact_for_run() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts" \
              --jq '.artifacts[] | select(.expired == false and .name == "channel-kernel-mainline-7.1") | .id' \
              | head -n1
          }

          RUN_ID=""
          if [ -n "$REQUESTED_RUN_ID" ]; then
            CONCLUSION="$(gh run view "$REQUESTED_RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
            test "$CONCLUSION" = success
            ARTIFACT_ID="$(artifact_for_run "$REQUESTED_RUN_ID")"
            if [ -z "$ARTIFACT_ID" ]; then
              echo "Requested run $REQUESTED_RUN_ID has no live channel-kernel-mainline-7.1 artifact." >&2
              exit 1
            fi
            RUN_ID="$REQUESTED_RUN_ID"
          else
            while IFS= read -r CANDIDATE; do
              [ -n "$CANDIDATE" ] || continue
              if [ -n "$(artifact_for_run "$CANDIDATE")" ]; then
                RUN_ID="$CANDIDATE"
                break
              fi
            done < <(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow kernel-mainline-7.1.yml \
              --status success \
              --limit 10 \
              --json databaseId \
              --jq '.[].databaseId')
          fi

          if [ -n "$RUN_ID" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No live reusable kernel artifact; a temporary kernel will be built for this rootfs run."
          fi

      - name: Download reusable kernel artifact
        if: steps.kernel_run.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.kernel_run.outputs.run_id }}
          github-token: ${{ github.token }}
          name: channel-kernel-mainline-7.1
          path: kernel-artifact

      - name: Select reusable kernel artifact
        if: steps.kernel_run.outputs.found == 'true'
        run: |
          set -euxo pipefail
          KERNEL_ARTIFACT="$GITHUB_WORKSPACE/kernel-artifact"
          KREL="$(cat "$KERNEL_ARTIFACT/kernel-release.txt")"
          MODULES_ARCHIVE="$(find "$KERNEL_ARTIFACT" -maxdepth 1 -type f -name 'kernel-modules-*.tar.zst' -print -quit)"
          KERNEL_CONFIG_FILE="$(find "$KERNEL_ARTIFACT" -maxdepth 1 -type f -name 'kernel.config-*' -print -quit)"

          test -n "$KREL"
          test -s "$MODULES_ARCHIVE"
          test -s "$KERNEL_CONFIG_FILE"
          test -s "$KERNEL_ARTIFACT/System.map"
          test -s "$KERNEL_ARTIFACT/sdm632-motorola-channel.dtb"
          test "$(fdtget -t s "$KERNEL_ARTIFACT/sdm632-motorola-channel.dtb" /soc@0/remoteproc@a204000/iris compatible)" = "qcom,wcn3620"

          echo "KERNEL_RELEASE=$KREL" >> "$GITHUB_ENV"
          echo "KERNEL_MODULES_ARCHIVE=$MODULES_ARCHIVE" >> "$GITHUB_ENV"
          echo "KERNEL_CONFIG_FILE=$KERNEL_CONFIG_FILE" >> "$GITHUB_ENV"
          echo "KERNEL_SYSTEM_MAP_FILE=$KERNEL_ARTIFACT/System.map" >> "$GITHUB_ENV"

      - name: Build temporary kernel dependency for rootfs
        if: steps.kernel_run.outputs.found != 'true'
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          set -euxo pipefail
          rm -rf kernel out .work
          mkdir -p out
          git clone --depth=1 --branch "$KERNEL_REF" "$KERNEL_URL" kernel
          chmod +x scripts/build-kernel.sh
          scripts/build-kernel.sh
          test -s out/kernel-release.txt
          test -s kernel/System.map
          echo "Temporary kernel is local to this rootfs run and will not be uploaded."

      - name: Build Ubuntu minimal rootfs
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          OUT_DIR: ${{ github.workspace }}/out
          WORK_DIR: ${{ github.workspace }}/.work
          KERNEL_RELEASE: ${{ env.KERNEL_RELEASE }}
        run: |
          set -euxo pipefail
          chmod +x scripts/build-rootfs.sh
          scripts/build-rootfs.sh

          test -s out/rootfs.ext4.zst
          grep -q '^rootfs_label=rootfs$' out/build-info.txt
          grep -q '^rootfs_uuid=89530000-6320-4000-8000-000000000001$' out/build-info.txt
          grep -q '^distribution=ubuntu$' out/build-info.txt
          grep -q '^ubuntu_version=26.04.1$' out/build-info.txt
          sha256sum out/rootfs.ext4.zst \
            out/build-info.txt | tee out/SHA256SUMS.rootfs

      - name: Upload rootfs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: |
            out/rootfs.ext4.zst
            out/build-info.txt
            out/SHA256SUMS.rootfs
          if-no-files-found: error
          retention-days: 14
