name: Build Moto G7 Play mainline Alpine

on:
  push:
    branches: [alpine]
  workflow_dispatch:
    inputs:
      ssh_auth:
        description: SSH authentication mode (open-root-usb = direct root login on USB only)
        required: true
        type: choice
        default: generated-key
        options:
          - generated-key
          - public-key-input
          - public-key-secret
          - generated-password
          - password-secret
          - generated-key+generated-password
          - public-key-input+password-secret
          - public-key-secret+password-secret
          - open-root-usb
      ssh_public_key:
        description: Public key to install when using a public-key-input mode
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: channel-mainline-alpine-build
  # Supersede stale intermediate Alpine migration builds with the newest commit.
  cancel-in-progress: true

env:
  KERNEL_URL: https://github.com/SaaSD3v/linux.git
  KERNEL_REF: msm8953/latest
  LK2ND_URL: https://github.com/msm8916-mainline/lk2nd.git
  LK2ND_REF: "23.1"
  DTBO_URL: https://github.com/barni2000/dtbo-lk2nd.git
  MKBOOTIMG_URL: https://android.googlesource.com/platform/system/tools/mkbootimg
  MKBOOTIMG_REF: d3b6ee4295e1491432ce3d0fcfd53631177bbef4
  BUSYBOX_VERSION: "1.38.0"
  CHANNEL_ROOT_UUID: 89530000-6320-4000-8000-000000000001

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Validate local scripts
        run: |
          set -eux
          bash -n scripts/build-kernel.sh
          bash -n scripts/build-rootfs.sh
          bash -n scripts/build-bootimg.sh
          bash -n scripts/build-initramfs.sh
          sh -n rootfs/usr/local/sbin/channel-usb-gadget
          sh -n rootfs/usr/local/sbin/channel-wifi-firmware
          sh -n rootfs/etc/init.d/channel-usb-gadget
          sh -n rootfs/etc/init.d/channel-sshd
          sh -n rootfs/etc/init.d/channel-wifi-firmware

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl make bc bison flex \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross libc6-arm64-cross linux-libc-dev-arm64-cross gcc-arm-none-eabi \
            device-tree-compiler libfdt-dev libssl-dev libelf-dev dwarves \
            python3 python3-pip rsync cpio gzip bzip2 xz-utils zstd \
            e2fsprogs arch-test qemu-user-static binfmt-support \
            openssh-client openssl kmod file

          # Fail early if the runner cannot execute arm64 binaries through binfmt.
          sudo update-binfmts --enable qemu-aarch64
          arch-test arm64

          if ! command -v mkdtboimg >/dev/null 2>&1; then
            git clone --depth=1 https://android.googlesource.com/platform/system/libufdt /tmp/libufdt
            sudo install -m 0755 /tmp/libufdt/utils/src/mkdtboimg.py /usr/local/bin/mkdtboimg
          fi
          command -v mkdtboimg

          # Use AOSP mkbootimg directly. Ubuntu 24.04's mkbootimg package can
          # install /usr/bin/mkbootimg without its Python gki module.
          rm -rf aosp-mkbootimg
          git init aosp-mkbootimg
          git -C aosp-mkbootimg remote add origin "$MKBOOTIMG_URL"
          git -C aosp-mkbootimg fetch --depth=1 origin "$MKBOOTIMG_REF"
          git -C aosp-mkbootimg checkout --detach FETCH_HEAD
          test "$(git -C aosp-mkbootimg rev-parse HEAD)" = "$MKBOOTIMG_REF"
          python3 aosp-mkbootimg/mkbootimg.py --help >/dev/null
          python3 aosp-mkbootimg/unpack_bootimg.py --help >/dev/null

      - name: Resolve reusable kernel checkpoint
        id: kernel-key
        run: |
          set -euxo pipefail
          KERNEL_SOURCE_SHA="$(git ls-remote "$KERNEL_URL" "refs/heads/$KERNEL_REF" | awk 'NR==1 {print $1}')"
          test -n "$KERNEL_SOURCE_SHA"
          CONFIG_SHA="$(sha256sum config/channel-mainline.config | awk '{print $1}')"
          KERNEL_HELPER_SHA="$(sha256sum scripts/build-kernel.sh | awk '{print $1}')"
          CACHE_KEY="channel-kernel-v4-${RUNNER_OS}-$KERNEL_SOURCE_SHA-$CONFIG_SHA-$KERNEL_HELPER_SHA"
          echo "source_sha=$KERNEL_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Restore reusable kernel checkpoint
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/channel-kernel
          key: ${{ steps.kernel-key.outputs.cache_key }}

      - name: Clone fixed Channel mainline kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          rm -rf kernel out
          mkdir -p out

          git clone --depth=1 --branch "$KERNEL_REF" "$KERNEL_URL" kernel
          CHANNEL_DTS="kernel/arch/arm64/boot/dts/qcom/sdm632-motorola-channel.dts"
          test -s "$CHANNEL_DTS"

          {
            echo "=== kernel source ==="
            echo "selected_branch=$KERNEL_REF"
            echo "selected_channel_dts=arch/arm64/boot/dts/qcom/sdm632-motorola-channel.dts"
            git -C kernel remote -v
            git -C kernel rev-parse HEAD
            git -C kernel log -1 --date=iso --format='%H%n%ad%n%an%n%s'
          } | tee out/source-report.txt

      - name: Build mainline kernel with shared helper
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          set -euxo pipefail
          chmod +x scripts/build-kernel.sh
          scripts/build-kernel.sh

          KREL="$(cat out/kernel-release.txt)"
          test -n "$KREL"
          case "$KREL" in *-dirty) echo "dirty kernel release is not allowed: $KREL" >&2; exit 1;; esac
          DTB="out/sdm632-motorola-channel.dtb"
          test -s "$DTB"
          test -s kernel/System.map

          IRIS_COMPATIBLE="$(fdtget -t s "$DTB" /soc@0/remoteproc@a204000/iris compatible)"
          test "$IRIS_COMPATIBLE" = "qcom,wcn3620"

          cp kernel/System.map out/System.map
          cp kernel/arch/arm64/boot/Image.gz out/Image.gz
          cp "out/kernel.config-$KREL" out/kernel.config
          cat out/Image.gz "$DTB" > out/Image.gz-dtb

          rm -rf out/modules-root
          mkdir -p out/modules-root
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KERNELRELEASE="$KREL" \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/out/modules-root" modules_install
          tar -I 'zstd -T0 -10' -cf "out/kernel-modules-$KREL.tar.zst" \
            -C out/modules-root lib/modules
          rm -rf out/modules-root

          {
            echo
            echo "=== Channel Wi-Fi validation ==="
            echo "iris_compatible=$IRIS_COMPATIBLE"
            git -C kernel diff -- arch/arm64/boot/dts/qcom/sdm632-motorola-channel.dts
            echo
            echo "=== built kernel ==="
            echo "kernel_release=$KREL"
            sha256sum out/Image.gz "$DTB"
            echo
            echo "=== selected WCNSS config ==="
            grep -E '^CONFIG_(WLAN|WLAN_VENDOR_ATH|CFG80211|MAC80211|WCN36XX|QCOM_WCNSS_PIL|QCOM_WCNSS_CTRL|RPMSG_QCOM_SMD|QCOM_SMEM|QCOM_SMP2P|QCOM_SMSM)=' out/kernel.config | sort
          } | tee -a out/source-report.txt

          rm -rf .cache/channel-kernel
          mkdir -p .cache/channel-kernel
          cp out/Image.gz out/Image.gz-dtb out/sdm632-motorola-channel.dtb \
            out/kernel.config out/System.map out/kernel-release.txt \
            out/kernel-git-revision.txt out/kernel-modules-*.tar.zst \
            out/source-report.txt .cache/channel-kernel/

      - name: Materialize restored kernel checkpoint
        if: steps.kernel-cache.outputs.cache-hit == 'true'
        run: |
          set -euxo pipefail
          mkdir -p out
          cp -a .cache/channel-kernel/. out/
          test -s out/Image.gz
          test -s out/Image.gz-dtb
          test -s out/kernel.config
          test -s out/kernel-release.txt
          CHANNEL_DTB_FILE="$(find out -maxdepth 1 -type f -name '*channel*.dtb' -print -quit)"
          test -n "$CHANNEL_DTB_FILE"
          test "$(fdtget -t s "$CHANNEL_DTB_FILE" /soc@0/remoteproc@a204000/iris compatible)" = "qcom,wcn3620"
          grep -qx 'CONFIG_WCN36XX=m' out/kernel.config
          grep -qx 'CONFIG_QCOM_WCNSS_PIL=m' out/kernel.config
          grep -qx 'CONFIG_QCOM_WCNSS_CTRL=m' out/kernel.config
          grep -qx 'CONFIG_RPMSG_QCOM_SMD=y' out/kernel.config
          grep -qx 'CONFIG_QCOM_SMEM=y' out/kernel.config
          grep -qx 'CONFIG_QCOM_SMP2P=y' out/kernel.config
          compgen -G 'out/kernel-modules-*.tar.zst' >/dev/null
          KREL="$(cat out/kernel-release.txt)"
          test -n "$KREL"
          echo "KERNEL_RELEASE=$KREL" >> "$GITHUB_ENV"

      - name: Save reusable kernel checkpoint
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/channel-kernel
          key: ${{ steps.kernel-key.outputs.cache_key }}

      - name: Upload kernel checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: channel-kernel-${{ steps.kernel-key.outputs.source_sha }}
          path: |
            out/Image.gz
            out/Image.gz-dtb
            out/Image.gz-dtb-*
            out/kernel-cmdline.txt
            out/*.dtb
            out/kernel.config
            out/System.map
            out/kernel-release.txt
            out/kernel-git-revision.txt
            out/kernel-modules-*.tar.zst
            out/source-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Build current lk2nd for MSM8953/SDM632
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch "$LK2ND_REF" "$LK2ND_URL" lk2nd
          make -C lk2nd -j"$(nproc)" TOOLCHAIN_PREFIX=arm-none-eabi- lk2nd-msm8953
          LK2ND_IMG="lk2nd/build-lk2nd-msm8953/lk2nd.img"
          test -s "$LK2ND_IMG"
          strings "$LK2ND_IMG" | grep -F "Motorola Moto G7 Play (Channel)"
          strings "$LK2ND_IMG" | grep -F "sdm632-motorola-channel"
          cp "$LK2ND_IMG" out/lk2nd-msm8953.img
          git -C lk2nd rev-parse HEAD > out/lk2nd-commit.txt

      - name: Build required minimal DTBO
        run: |
          set -euxo pipefail
          git clone --depth=1 "$DTBO_URL" dtbo-lk2nd
          make -C dtbo-lk2nd build/dtbo-motorola-channel.img
          test -s dtbo-lk2nd/build/dtbo-motorola-channel.img
          cp dtbo-lk2nd/build/dtbo-motorola-channel.img out/dtbo-motorola-channel.img
          git -C dtbo-lk2nd rev-parse HEAD > out/dtbo-lk2nd-commit.txt

      - name: Build Alpine rootfs
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          OUT_DIR: ${{ github.workspace }}/out
          WORK_DIR: ${{ github.workspace }}/.work
          KERNEL_RELEASE: ${{ env.KERNEL_RELEASE }}
          SSH_AUTH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.ssh_auth || 'auto' }}
          SSH_PUBLIC_KEY_INPUT: ${{ inputs.ssh_public_key }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euxo pipefail
          chmod +x scripts/build-rootfs.sh
          MODULES_ARCHIVE="$(ls out/kernel-modules-*.tar.zst | head -n1)"
          test -s "$MODULES_ARCHIVE"
          export KERNEL_MODULES_ARCHIVE="$GITHUB_WORKSPACE/$MODULES_ARCHIVE"
          export KERNEL_CONFIG_FILE="$GITHUB_WORKSPACE/out/kernel.config"
          export KERNEL_SYSTEM_MAP_FILE="$GITHUB_WORKSPACE/out/System.map"
          scripts/build-rootfs.sh

      - name: Build static ARM64 BusyBox
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fsSLO --retry 3 "https://busybox.net/downloads/busybox-$BUSYBOX_VERSION.tar.bz2"
          curl -fsSLO --retry 3 "https://busybox.net/downloads/busybox-$BUSYBOX_VERSION.tar.bz2.sha256"
          sha256sum -c "busybox-$BUSYBOX_VERSION.tar.bz2.sha256"
          tar -xjf "busybox-$BUSYBOX_VERSION.tar.bz2"
          cd "busybox-$BUSYBOX_VERSION"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          sed -i 's/^# CONFIG_STATIC is not set$/CONFIG_STATIC=y/' .config
          set +o pipefail
          yes '' | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig >/dev/null
          BB_OLDCONFIG_RC=${PIPESTATUS[1]}
          set -o pipefail
          test "$BB_OLDCONFIG_RC" -eq 0
          grep -qx 'CONFIG_STATIC=y' .config
          grep -qx 'CONFIG_BLKID=y' .config
          grep -qx 'CONFIG_MDEV=y' .config
          grep -qx 'CONFIG_SWITCH_ROOT=y' .config
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          file busybox | grep -Eq 'ARM aarch64|ARM64'
          file busybox | grep -qi 'statically linked'
          cp busybox "$GITHUB_WORKSPACE/out/busybox-aarch64-static"

      - name: Build fixed-UUID initramfs
        env:
          BUSYBOX_BIN: ${{ github.workspace }}/out/busybox-aarch64-static
          OUT_DIR: ${{ github.workspace }}/out
          WORK_DIR: ${{ github.workspace }}/.initramfs-work
          CHANNEL_ROOT_UUID: ${{ env.CHANNEL_ROOT_UUID }}
        run: |
          set -euxo pipefail
          chmod +x scripts/build-initramfs.sh
          scripts/build-initramfs.sh
          test -s out/initramfs-channel.cpio.gz
          grep -Fqx "rootfs_label=rootfs" out/initramfs-report.txt
          grep -Fqx "rootfs_uuid=$CHANNEL_ROOT_UUID" out/initramfs-report.txt
          grep -Fqx "root_locator=fixed-filesystem-uuid" out/initramfs-report.txt

      - name: Pack fixed-UUID rootfs boot image
        env:
          KERNEL_RELEASE: ${{ env.KERNEL_RELEASE }}
          OUT_DIR: ${{ github.workspace }}/out
          KERNEL_IMAGE: ${{ github.workspace }}/out/Image.gz
          CHANNEL_DTB: ${{ github.workspace }}/out/sdm632-motorola-channel.dtb
          MKBOOTIMG_PY: ${{ github.workspace }}/aosp-mkbootimg/mkbootimg.py
          INITRAMFS_IMAGE: ${{ github.workspace }}/out/initramfs-channel.cpio.gz
        run: |
          set -euxo pipefail
          chmod +x scripts/build-bootimg.sh
          scripts/build-bootimg.sh

          test -s out/boot-channel.img
          test -s "out/Image.gz-dtb-$KERNEL_RELEASE"
          test -s out/kernel-cmdline.txt
          grep -q 'rdinit=/init' out/kernel-cmdline.txt
          grep -q 'console=tty0' out/kernel-cmdline.txt
          ! grep -q 'root=PARTUUID=' out/kernel-cmdline.txt
          ! grep -q 'root=UUID=' out/kernel-cmdline.txt
          file out/boot-channel.img

          rm -rf /tmp/unpacked-boot
          python3 aosp-mkbootimg/unpack_bootimg.py --boot_img out/boot-channel.img --out /tmp/unpacked-boot
          test -s /tmp/unpacked-boot/kernel
          test -s /tmp/unpacked-boot/ramdisk
          gzip -t /tmp/unpacked-boot/ramdisk

          {
            echo
            echo "=== boot image ==="
            printf 'cmdline='
            cat out/kernel-cmdline.txt
            file out/boot-channel.img
            sha256sum out/boot-channel.img out/lk2nd-msm8953.img out/dtbo-motorola-channel.img
          } | tee -a out/source-report.txt

      - name: Final static review
        run: |
          set -euxo pipefail
          test -s out/lk2nd-msm8953.img
          test -s out/dtbo-motorola-channel.img
          test -s out/boot-channel.img
          test -s out/rootfs.ext4.zst
          grep -Fqx "rootfs_label=rootfs" out/build-info.txt
          grep -Fqx "rootfs_uuid=89530000-6320-4000-8000-000000000001" out/build-info.txt
          test -s out/source-report.txt

          # Rootfs generation validates sshd itself. Confirm the selected mode
          # and fixed USB management address made it into the build metadata.
          grep -q '^ssh_auth=' out/build-info.txt
          grep -q '^usb_device_ip=172.16.42.1$' out/build-info.txt
          grep -q '^wifi_firmware=stock-modem-vendor-readonly$' out/build-info.txt
          grep -q '^distribution=alpine$' out/build-info.txt
          grep -q '^init=openrc$' out/build-info.txt
          grep -q '^time_sync=chrony$' out/build-info.txt

          # Ensure the exact USB feature required for Windows/Linux is requested.
          grep -q '^CONFIG_USB_CONFIGFS_RNDIS=y$' out/kernel.config
          grep -q '^CONFIG_USB_DWC3_QCOM=y$' out/kernel.config

          # Confirm the full build carries the validated Channel Wi-Fi DTB.
          CHANNEL_DTB_FILE="$(find out -maxdepth 1 -type f -name '*channel*.dtb' -print -quit)"
          test -n "$CHANNEL_DTB_FILE"
          test "$(fdtget -t s "$CHANNEL_DTB_FILE" /soc@0/remoteproc@a204000/iris compatible)" = "qcom,wcn3620"

          sha256sum out/* | tee out/SHA256SUMS.final

      - name: Upload flash/build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-mainline-alpine
          path: |
            out/boot-channel.img
            out/initramfs-channel.cpio.gz
            out/initramfs-report.txt
            out/lk2nd-msm8953.img
            out/dtbo-motorola-channel.img
            out/Image.gz
            out/Image.gz-dtb
            out/*.dtb
            out/rootfs.ext4.zst
            out/build-info.txt
            out/source-report.txt
            out/lk2nd-commit.txt
            out/dtbo-lk2nd-commit.txt
            out/kernel.config
            out/System.map
            out/kernel-release.txt
            out/kernel-modules-*.tar.zst
            out/SHA256SUMS*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload generated SSH test key
        if: always() && hashFiles('out/channel_test_ed25519') != ''
        uses: actions/upload-artifact@v4
        with:
          name: channel-ssh-test-key
          path: |
            out/channel_test_ed25519
            out/channel_test_ed25519.pub
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload generated SSH password
        if: always() && hashFiles('out/channel_ssh_password.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: channel-ssh-password
          path: out/channel_ssh_password.txt
          if-no-files-found: ignore
          retention-days: 1
