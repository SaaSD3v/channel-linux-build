name: Build kernel mainline 7.1

on:
  push:
    branches: [kernel-mainline-7.1]
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_URL: https://gitlab.com/moto8953-revived/channel/Mainline/channel-linux.git
  MKBOOTIMG_URL: https://android.googlesource.com/platform/system/tools/mkbootimg
  MKBOOTIMG_REF: d3b6ee4295e1491432ce3d0fcfd53631177bbef4

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Validate shared build scripts
        run: |
          set -eux
          bash -n scripts/build-kernel.sh
          bash -n scripts/build-rootfs.sh
          bash -n scripts/build-bootimg.sh
          sh -n rootfs/usr/local/sbin/channel-usb-gadget
          sh -n rootfs/usr/local/sbin/channel-wifi-firmware
          sh -n rootfs/usr/local/sbin/channel-wifi-dhcp
          sh -n rootfs/usr/local/libexec/channel-udhcpc

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl make bc bison flex \
            gcc-aarch64-linux-gnu device-tree-compiler \
            libssl-dev libelf-dev dwarves \
            python3 python3-pip rsync cpio gzip xz-utils zstd \
            e2fsprogs mmdebstrap arch-test qemu-user-static binfmt-support \
            openssh-client openssl kmod file

          DEBIAN_KEYRING_DEB=/tmp/debian-archive-keyring_2025.1_all.deb
          curl -fsSL --retry 3 \
            https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb \
            -o "$DEBIAN_KEYRING_DEB"
          echo '9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  /tmp/debian-archive-keyring_2025.1_all.deb' | sha256sum -c -
          sudo dpkg -i "$DEBIAN_KEYRING_DEB"
          test -s /usr/share/keyrings/debian-archive-keyring.gpg

          sudo update-binfmts --enable qemu-aarch64
          arch-test arm64

          rm -rf aosp-mkbootimg
          git init aosp-mkbootimg
          git -C aosp-mkbootimg remote add origin "$MKBOOTIMG_URL"
          git -C aosp-mkbootimg fetch --depth=1 origin "$MKBOOTIMG_REF"
          git -C aosp-mkbootimg checkout --detach FETCH_HEAD
          test "$(git -C aosp-mkbootimg rev-parse HEAD)" = "$MKBOOTIMG_REF"
          python3 aosp-mkbootimg/mkbootimg.py --help >/dev/null
          python3 aosp-mkbootimg/unpack_bootimg.py --help >/dev/null

      - name: Clone fresh channel mainline kernel
        run: |
          set -euxo pipefail
          rm -rf kernel out .work
          mkdir -p out
          git clone --depth=1 --branch channel "$KERNEL_URL" kernel
          {
            echo "=== kernel source ==="
            git -C kernel remote -v
            git -C kernel rev-parse HEAD
            git -C kernel log -1 --date=iso --format='%H%n%ad%n%an%n%s'
          } | tee out/source-report.txt

      - name: Configure and build kernel
        env:
          KERNEL_DIR: \${{ github.workspace }}/kernel
          OUT_DIR: \${{ github.workspace }}/out
        run: |
          set -euxo pipefail
          chmod +x scripts/build-kernel.sh
          scripts/build-kernel.sh

          IRIS_COMPATIBLE="$(fdtget -t s out/sdm632-motorola-channel.dtb /soc@0/remoteproc@a204000/iris compatible)"
          test "$IRIS_COMPATIBLE" = "qcom,wcn3620"

          KREL="$(cat out/kernel-release.txt)"
          test -n "$KREL"
          case "$KREL" in *-dirty) echo "dirty kernel release is not allowed: $KREL" >&2; exit 1;; esac

          test -s kernel/System.map
          cp kernel/System.map out/System.map
          cp kernel/arch/arm64/boot/Image.gz out/Image.gz
          cat out/Image.gz out/sdm632-motorola-channel.dtb > out/Image.gz-dtb

          rm -rf out/modules-root
          mkdir -p out/modules-root
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KERNELRELEASE="$KREL" \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/out/modules-root" modules_install
          tar -I 'zstd -T0 -10' -cf "out/kernel-modules-$KREL.tar.zst" \
            -C out/modules-root lib/modules
          rm -rf out/modules-root

          {
            echo
            echo "=== Channel Wi-Fi validation ==="
            echo "iris_compatible=$IRIS_COMPATIBLE"
            sha256sum out/wcn3620-fix.patch
            git -C kernel diff -- arch/arm64/boot/dts/qcom/sdm632-motorola-channel.dts
          } >> out/source-report.txt

      - name: Build matching Debian rootfs and initramfs
        env:
          KERNEL_DIR: \${{ github.workspace }}/kernel
          OUT_DIR: \${{ github.workspace }}/out
          WORK_DIR: \${{ github.workspace }}/.work
          KERNEL_RELEASE: \${{ env.KERNEL_RELEASE }}
          SSH_AUTH_MODE: auto
          SSH_PUBLIC_KEY: \${{ secrets.SSH_PUBLIC_KEY }}
          WIFI_SSID: \${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: \${{ secrets.WIFI_PASSWORD }}
          WIFI_COUNTRY: \${{ secrets.WIFI_COUNTRY }}
        run: |
          set -euxo pipefail
          chmod +x scripts/build-rootfs.sh
          MODULES_ARCHIVE="$(ls out/kernel-modules-*.tar.zst | head -n1)"
          test -s "$MODULES_ARCHIVE"
          export KERNEL_MODULES_ARCHIVE="$GITHUB_WORKSPACE/$MODULES_ARCHIVE"
          export KERNEL_CONFIG_FILE="$GITHUB_WORKSPACE/out/kernel.config-$KERNEL_RELEASE"
          export KERNEL_SYSTEM_MAP_FILE="$GITHUB_WORKSPACE/out/System.map"
          scripts/build-rootfs.sh

      - name: Pack boot-channel.img like main
        env:
          KERNEL_RELEASE: \${{ env.KERNEL_RELEASE }}
          OUT_DIR: \${{ github.workspace }}/out
          KERNEL_IMAGE: \${{ github.workspace }}/out/Image.gz
          CHANNEL_DTB: \${{ github.workspace }}/out/sdm632-motorola-channel.dtb
          MKBOOTIMG_PY: \${{ github.workspace }}/aosp-mkbootimg/mkbootimg.py
        run: |
          set -euxo pipefail
          chmod +x scripts/build-bootimg.sh
          scripts/build-bootimg.sh

          test -s out/boot-channel.img
          test -s "out/initrd.img-$KERNEL_RELEASE"
          test -s out/debian-channel-rootfs.ext4.zst

          rm -rf /tmp/unpacked-boot
          python3 aosp-mkbootimg/unpack_bootimg.py \
            --boot_img out/boot-channel.img \
            --out /tmp/unpacked-boot
          test -s /tmp/unpacked-boot/kernel
          test -s /tmp/unpacked-boot/ramdisk

          {
            echo
            echo "=== boot image ==="
            printf 'cmdline='
            cat out/kernel-cmdline.txt
            file out/boot-channel.img
          } >> out/source-report.txt

          sha256sum \
            out/boot-channel.img \
            out/Image.gz \
            out/Image.gz-dtb \
            out/Image.gz-dtb-* \
            out/sdm632-motorola-channel.dtb \
            out/initrd.img-* \
            out/debian-channel-rootfs.ext4.zst \
            out/kernel-modules-*.tar.zst \
            out/wcn3620-fix.patch \
            > out/SHA256SUMS

      - name: Upload kernel and boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: channel-kernel-mainline-7.1
          path: |
            out/boot-channel.img
            out/Image.gz
            out/Image.gz-dtb
            out/Image.gz-dtb-*
            out/sdm632-motorola-channel.dtb
            out/initrd.img-*
            out/debian-channel-rootfs.ext4.zst
            out/build-info.txt
            out/kernel-cmdline.txt
            out/kernel.config-*
            out/kernel-release.txt
            out/kernel-git-revision.txt
            out/kernel-modules-*.tar.zst
            out/System.map
            out/source-report.txt
            out/wcn3620-fix.patch
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated SSH test key
        if: always() && hashFiles('out/channel_test_ed25519') != ''
        uses: actions/upload-artifact@v4
        with:
          name: channel-kernel-ssh-test-key
          path: |
            out/channel_test_ed25519
            out/channel_test_ed25519.pub
          if-no-files-found: ignore
          retention-days: 1
