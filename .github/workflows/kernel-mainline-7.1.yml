name: Build kernel mainline 7.1

on:
  push:
    branches: [kernel-mainline-7.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-kernel-mainline-7.1
  cancel-in-progress: true

env:
  KERNEL_URL: https://github.com/SaaSD3v/linux.git
  KERNEL_REF: msm8953/latest
  MKBOOTIMG_URL: https://android.googlesource.com/platform/system/tools/mkbootimg
  MKBOOTIMG_REF: d3b6ee4295e1491432ce3d0fcfd53631177bbef4
  BUSYBOX_VERSION: "1.38.0"
  CHANNEL_ROOT_UUID: 89530000-6320-4000-8000-000000000001

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel build files
        uses: actions/checkout@v4

      - name: Validate kernel build scripts
        run: |
          set -eux
          bash -n scripts/build-kernel.sh
          bash -n scripts/build-bootimg.sh
          bash -n scripts/build-initramfs.sh

      - name: Install kernel build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates make bc bison flex \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross libc6-arm64-cross linux-libc-dev-arm64-cross device-tree-compiler \
            libssl-dev libelf-dev dwarves \
            python3 zstd file cpio gzip bzip2

          rm -rf aosp-mkbootimg
          git init aosp-mkbootimg
          git -C aosp-mkbootimg remote add origin "$MKBOOTIMG_URL"
          git -C aosp-mkbootimg fetch --depth=1 origin "$MKBOOTIMG_REF"
          git -C aosp-mkbootimg checkout --detach FETCH_HEAD
          test "$(git -C aosp-mkbootimg rev-parse HEAD)" = "$MKBOOTIMG_REF"
          python3 aosp-mkbootimg/mkbootimg.py --help >/dev/null
          python3 aosp-mkbootimg/unpack_bootimg.py --help >/dev/null

      - name: Clone fresh Channel mainline kernel
        run: |
          set -euxo pipefail
          rm -rf kernel out
          mkdir -p out
          git clone --depth=1 --branch "$KERNEL_REF" "$KERNEL_URL" kernel
          {
            echo "=== kernel source ==="
            git -C kernel remote -v
            git -C kernel rev-parse HEAD
            git -C kernel log -1 --date=iso --format='%H%n%ad%n%an%n%s'
          } | tee out/source-report.txt

      - name: Configure and build Channel kernel
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          set -euxo pipefail
          chmod +x scripts/build-kernel.sh
          scripts/build-kernel.sh

          IRIS_COMPATIBLE="$(fdtget -t s out/sdm632-motorola-channel.dtb /soc@0/remoteproc@a204000/iris compatible)"
          test "$IRIS_COMPATIBLE" = "qcom,wcn3620"

          KREL="$(cat out/kernel-release.txt)"
          test -n "$KREL"
          case "$KREL" in *-dirty) echo "dirty kernel release is not allowed: $KREL" >&2; exit 1;; esac

          test -s kernel/System.map
          cp kernel/System.map out/System.map
          cp kernel/arch/arm64/boot/Image.gz out/Image.gz
          cat out/Image.gz out/sdm632-motorola-channel.dtb > out/Image.gz-dtb

          rm -rf out/modules-root
          mkdir -p out/modules-root
          make -C kernel ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KERNELRELEASE="$KREL" \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/out/modules-root" modules_install
          tar -I 'zstd -T0 -10' -cf "out/kernel-modules-$KREL.tar.zst" \
            -C out/modules-root lib/modules
          rm -rf out/modules-root

          {
            echo
            echo "=== Channel Wi-Fi validation ==="
            echo "iris_compatible=$IRIS_COMPATIBLE"
            git -C kernel diff -- arch/arm64/boot/dts/qcom/sdm632-motorola-channel.dts
          } >> out/source-report.txt

      - name: Build static ARM64 BusyBox
        run: |
          set -euxo pipefail
          cd /tmp
          curl -fsSLO --retry 3 "https://busybox.net/downloads/busybox-$BUSYBOX_VERSION.tar.bz2"
          curl -fsSLO --retry 3 "https://busybox.net/downloads/busybox-$BUSYBOX_VERSION.tar.bz2.sha256"
          sha256sum -c "busybox-$BUSYBOX_VERSION.tar.bz2.sha256"
          tar -xjf "busybox-$BUSYBOX_VERSION.tar.bz2"
          cd "busybox-$BUSYBOX_VERSION"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          sed -i 's/^# CONFIG_STATIC is not set$/CONFIG_STATIC=y/' .config
          set +o pipefail
          yes '' | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oldconfig >/dev/null
          BB_OLDCONFIG_RC=${PIPESTATUS[1]}
          set -o pipefail
          test "$BB_OLDCONFIG_RC" -eq 0
          grep -qx 'CONFIG_STATIC=y' .config
          grep -qx 'CONFIG_BLKID=y' .config
          grep -qx 'CONFIG_MDEV=y' .config
          grep -qx 'CONFIG_SWITCH_ROOT=y' .config
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          file busybox | grep -Eq 'ARM aarch64|ARM64'
          file busybox | grep -qi 'statically linked'
          cp busybox "$GITHUB_WORKSPACE/out/busybox-aarch64-static"

      - name: Build fixed-UUID initramfs
        env:
          BUSYBOX_BIN: ${{ github.workspace }}/out/busybox-aarch64-static
          OUT_DIR: ${{ github.workspace }}/out
          WORK_DIR: ${{ github.workspace }}/.initramfs-work
          CHANNEL_ROOT_UUID: ${{ env.CHANNEL_ROOT_UUID }}
        run: |
          set -euxo pipefail
          chmod +x scripts/build-initramfs.sh
          scripts/build-initramfs.sh
          test -s out/initramfs-channel.cpio.gz
          grep -Fqx 'rootfs_label=rootfs' out/initramfs-report.txt
          grep -Fqx "rootfs_uuid=$CHANNEL_ROOT_UUID" out/initramfs-report.txt
          grep -Fqx 'root_locator=fixed-filesystem-uuid' out/initramfs-report.txt

      - name: Pack fixed-UUID rootfs boot image
        env:
          KERNEL_RELEASE: ${{ env.KERNEL_RELEASE }}
          OUT_DIR: ${{ github.workspace }}/out
          KERNEL_IMAGE: ${{ github.workspace }}/out/Image.gz
          CHANNEL_DTB: ${{ github.workspace }}/out/sdm632-motorola-channel.dtb
          MKBOOTIMG_PY: ${{ github.workspace }}/aosp-mkbootimg/mkbootimg.py
          INITRAMFS_IMAGE: ${{ github.workspace }}/out/initramfs-channel.cpio.gz
        run: |
          set -euxo pipefail
          chmod +x scripts/build-bootimg.sh
          scripts/build-bootimg.sh

          test -s out/boot-channel.img
          test -s out/kernel-cmdline.txt
          grep -q 'rdinit=/init' out/kernel-cmdline.txt
          grep -q 'console=tty0' out/kernel-cmdline.txt
          ! grep -q 'root=PARTUUID=' out/kernel-cmdline.txt
          ! grep -q 'root=UUID=' out/kernel-cmdline.txt

          rm -rf /tmp/unpacked-boot
          python3 aosp-mkbootimg/unpack_bootimg.py \
            --boot_img out/boot-channel.img \
            --out /tmp/unpacked-boot

          test -s /tmp/unpacked-boot/kernel
          test -s /tmp/unpacked-boot/ramdisk
          gzip -t /tmp/unpacked-boot/ramdisk

          {
            echo
            echo "=== rootfs-independent boot image ==="
            printf 'cmdline='
            cat out/kernel-cmdline.txt
            file out/boot-channel.img
          } >> out/source-report.txt

          sha256sum \
            out/boot-channel.img \
            out/Image.gz \
            out/Image.gz-dtb \
            out/Image.gz-dtb-* \
            out/sdm632-motorola-channel.dtb \
            out/kernel-modules-*.tar.zst \
            > out/SHA256SUMS

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot-channel-img
          path: out/boot-channel.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: channel-kernel-mainline-7.1
          path: |
            out/boot-channel.img
            out/initramfs-channel.cpio.gz
            out/initramfs-report.txt
            out/kernel-cmdline.txt
            out/Image.gz
            out/Image.gz-dtb
            out/Image.gz-dtb-*
            out/sdm632-motorola-channel.dtb
            out/kernel.config-*
            out/kernel-release.txt
            out/kernel-git-revision.txt
            out/kernel-modules-*.tar.zst
            out/System.map
            out/source-report.txt
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
